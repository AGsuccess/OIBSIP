<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASK 3 | Professional To-Do Web App</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a; --section: #111; --card: #1a1a1a;
      --accent: #00ff88; --text: #ffffff; --gray: #8A8A8A;
      --danger: #ff4d4d; --font: 'Poppins', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); padding: 40px 20px; }

    .container { max-width: 800px; margin: auto; }
    header { text-align: center; margin-bottom: 40px; }
    header h1 { font-size: 2.5rem; color: var(--accent); }
    header p { color: var(--gray); }

    /* INPUT SECTION */
    .add-task { 
      display: flex; gap: 12px; background: var(--section); 
      padding: 20px; border-radius: 12px; border: 1px solid #222; margin-bottom: 40px;
    }
    .add-task input {
      flex: 1; padding: 14px; background: var(--card); border: 2px solid #333;
      border-radius: 8px; color: var(--text); font-size: 1rem; outline: none;
    }
    .add-task input:focus { border-color: var(--accent); }
    .btn {
      background: var(--accent); color: #000; border: none; padding: 14px 24px;
      border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { transform: scale(1.05); }

    /* LISTS */
    .lists-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .list-box { background: var(--section); padding: 25px; border-radius: 12px; border: 1px solid #222; }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .list-header h2 { font-size: 1.3rem; }
    .count { background: var(--card); padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; color: var(--accent); }

    /* TASK ITEM */
    .task {
      background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);} }
    
    .task-content { flex: 1; }
    .task-text { word-break: break-word; }
    .task-time { font-size: 0.75rem; color: var(--gray); margin-top: 5px; }
    .task.completed .task-text { text-decoration: line-through; opacity: 0.6; }

    .task-actions { display: flex; gap: 8px; }
    .task-actions button {
      background: none; border: none; color: var(--gray); cursor: pointer;
      font-size: 1.1rem; transition: 0.2s;
    }
    .task-actions button:hover { color: var(--accent); }
    .task-actions .delete:hover { color: var(--danger); }

    /* EMPTY STATE */
    .empty { text-align: center; color: var(--gray); padding: 30px 0; font-style: italic; }

    @media(max-width: 768px) { .lists-wrapper { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>TaskFlow</h1>
      <p>OIBSIP TASK 3 - Professional To-Do Web App</p>
    </header>

    <!-- INPUT FIELD + ADD BUTTON -->
    <div class="add-task">
      <input type="text" id="taskInput" placeholder="What needs to be done today?">
      <button class="btn" onclick="addTask()">Add Task</button>
    </div>

    <!-- 2 LISTS: PENDING + COMPLETED -->
    <div class="lists-wrapper">
      <!-- PENDING LIST -->
      <div class="list-box">
        <div class="list-header">
          <h2>Pending Tasks</h2>
          <span class="count" id="pendingCount">0 pending</span>
        </div>
        <div id="pendingList"></div>
      </div>

      <!-- COMPLETED LIST -->
      <div class="list-box">
        <div class="list-header">
          <h2>Completed Tasks</h2>
          <span class="count" id="completedCount">0 completed</span>
        </div>
        <div id="completedList"></div>
      </div>
    </div>
  </div>

<script>
  let tasks = JSON.parse(localStorage.getItem('oibsip_tasks')) || []; // PERSISTENCE

  // ADD TASK
  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (text === '') return;
    
    const newTask = {
      id: Date.now(),
      text: text,
      completed: false,
      createdAt: new Date().toLocaleString() // TIMESTAMP
    };
    tasks.push(newTask);
    input.value = '';
    saveAndRender();
  }

  // TOGGLE COMPLETE - MOVES BETWEEN LISTS
  function toggleTask(id) {
    tasks = tasks.map(task => 
      task.id === id ? {...task, completed: !task.completed, completedAt: new Date().toLocaleString()} : task
    );
    saveAndRender();
  }

  // EDIT TASK - INLINE
  function editTask(id) {
    const task = tasks.find(t => t.id === id);
    const newText = prompt("Edit your task:", task.text);
    if (newText !== null && newText.trim() !== '') {
      task.text = newText.trim();
      saveAndRender();
    }
  }

  // DELETE TASK
  function deleteTask(id) {
    if (confirm("Are you sure you want to delete this task?")) {
      tasks = tasks.filter(task => task.id !== id);
      saveAndRender();
    }
  }

  // SAVE TO localStorage + RENDER
  function saveAndRender() {
    localStorage.setItem('oibsip_tasks', JSON.stringify(tasks));
    renderTasks();
  }

  // RENDER FUNCTION
  function renderTasks() {
    const pendingList = document.getElementById('pendingList');
    const completedList = document.getElementById('completedList');
    
    const pendingTasks = tasks.filter(t => !t.completed);
    const completedTasks = tasks.filter(t => t.completed);

    // UPDATE COUNTS
    document.getElementById('pendingCount').innerText = `${pendingTasks.length} pending`;
    document.getElementById('completedCount').innerText = `${completedTasks.length} completed`;

    // RENDER PENDING
    pendingList.innerHTML = pendingTasks.length === 0 
      ? `<div class="empty">No pending tasks. Add one above!</div>`
      : pendingTasks.map(task => createTaskHTML(task)).join('');

    // RENDER COMPLETED
    completedList.innerHTML = completedTasks.length === 0 
      ? `<div class="empty">No completed tasks yet.</div>`
      : completedTasks.map(task => createTaskHTML(task)).join('');
  }

  // CREATE TASK HTML
  function createTaskHTML(task) {
    return `
      <div class="task ${task.completed ? 'completed' : ''}">
        <div class="task-content">
          <div class="task-text">${task.text}</div>
          <div class="task-time">
            Added: ${task.createdAt} ${task.completedAt ? `| Done: ${task.completedAt}` : ''}
          </div>
        </div>
        <div class="task-actions">
          <button onclick="toggleTask(${task.id})" title="Mark Complete">✓</button>
          <button onclick="editTask(${task.id})" title="Edit">✎</button>
          <button class="delete" onclick="deleteTask(${task.id})" title="Delete">✕</button>
        </div>
      </div>
    `;
  }

  // ENTER KEY SUPPORT
  document.getElementById('taskInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') addTask();
  });

  // INITIAL RENDER
  renderTasks();
</script>
</body>
</html>
