<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASK 4 | Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style> /* Same CSS as login */ 
    :root { --bg:#0a0a0a; --card:#111; --accent:#00ff88; --text:#fff; --gray:#8A8A8A; --danger:#ff4d4d; --font:'Poppins',sans-serif; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;align-items:center;justify-content:center;height:100vh;}
    .auth-box{background:var(--card);padding:40px;border-radius:16px;border:1px solid #222;width:100%;max-width:400px;}
    .auth-box h1{text-align:center;color:var(--accent);margin-bottom:10px;}
    .auth-box p{text-align:center;color:var(--gray);margin-bottom:30px;}
    .input-group{margin-bottom:20px;}
    .input-group label{display:block;margin-bottom:8px;font-size:0.9rem;color:var(--gray);}
    .input-group input{width:100%;padding:12px;background:#1a1a1a;border:2px solid #333;border-radius:8px;color:var(--text);outline:none;}
    .input-group input:focus{border-color:var(--accent);}
    .btn{width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:1rem;}
    .btn:hover{opacity:0.9;}
    .switch{text-align:center;margin-top:20px;color:var(--gray);}
    .switch a{color:var(--accent);text-decoration:none;}
    .error{color:var(--danger);background:#2a0000;padding:10px;border-radius:6px;margin-bottom:20px;text-align:center;display:none;}
    .success{color:var(--accent);background:#002a0f;padding:10px;border-radius:6px;margin-bottom:20px;text-align:center;display:none;}
  </style>
</head>
<body>
  <div class="auth-box">
    <h1>Create Account</h1>
    <p>OIBSIP TASK 4 - Register</p>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    <div class="input-group">
      <label>Username</label>
      <input type="text" id="regUsername" required>
    </div>
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="regEmail" required>
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="regPassword" required>
    </div>
    <button class="btn" onclick="register()">Register</button>
    <p class="switch">Already have an account? <a href="auth.html">Login</a></p>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
  function showError(msg) { document.getElementById('errorMsg').innerText = msg; document.getElementById('errorMsg').style.display = 'block'; }
  function showSuccess(msg) { document.getElementById('successMsg').innerText = msg; document.getElementById('successMsg').style.display = 'block'; }

  async function hashPassword(password) {
    return CryptoJS.SHA256(password).toString();
  }

  async function register() {
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    
    document.getElementById('errorMsg').style.display = 'none';
    
    // VALIDATION
    if(!username || !email || !password) return showError("All fields are required");
    if(password.length < 8) return showError("Password must be at least 8 characters");
    if(!/\d/.test(password)) return showError("Password must contain at least 1 number");

    let users = JSON.parse(localStorage.getItem('oibsip_users')) || [];
    
    // DUPLICATE CHECK
    if(users.find(u => u.email === email)) return showError("Email already exists");
    if(users.find(u => u.username === username)) return showError("Username already exists");

    const hashedPassword = await hashPassword(password);
    users.push({username, email, password: hashedPassword});
    localStorage.setItem('oibsip_users', JSON.stringify(users));
    
    showSuccess("Registration successful! Redirecting to login...");
    setTimeout(() => window.location.href = 'auth.html', 1500);
  }
</script>
</body>
</html>
