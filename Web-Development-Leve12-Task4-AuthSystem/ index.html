<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth System - OIBSIP</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{background:linear-gradient(135deg,#2563eb,#1d4ed8);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
    .container{background:#fff;width:100%;max-width:420px;padding:40px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.2);}
    h1{text-align:center;color:#1e293b;margin-bottom:25px;}
    .form-group{margin-bottom:20px;}
    label{display:block;margin-bottom:8px;font-weight:600;color:#334155;}
    input{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:8px;font-size:1rem;}
    input:focus{outline:none;border-color:#2563eb;}
    button{width:100%;background:#f97316;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:600;font-size:1rem;cursor:pointer;margin-top:10px;}
    button:hover{background:#ea580c;}
    .switch{text-align:center;margin-top:20px;color:#64748b;}
    .switch a{color:#2563eb;font-weight:600;text-decoration:none;cursor:pointer;}
    .error{color:#dc2626;font-size:0.9rem;margin-top:8px;}
    .success{color:#22c55e;font-size:0.9rem;margin-top:8px;}
    .dashboard{text-align:center;}
    .dashboard h2{color:#1e293b;margin-bottom:15px;}
    .logout-btn{background:#dc2626;}
    .logout-btn:hover{background:#b91c1c;}
    .hidden{display:none;}
  </style>
</head>
<body>
  <div class="container">
    
    <!-- REGISTER PAGE -->
    <div id="registerPage">
      <h1>Create Account</h1>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUsername">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword">
      </div>
      <div id="regError" class="error"></div>
      <div id="regSuccess" class="success"></div>
      <button onclick="register()">Register</button>
      <div class="switch">Already have an account? <a onclick="showLogin()">Login</a></div>
    </div>

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="hidden">
      <h1>Welcome Back</h1>
      <div class="form-group">
        <label>Username or Email</label>
        <input type="text" id="loginUser">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword">
      </div>
      <div id="loginError" class="error"></div>
      <button onclick="login()">Login</button>
      <div class="switch">Don't have an account? <a onclick="showRegister()">Register</a></div>
    </div>

    <!-- DASHBOARD / PROTECTED PAGE -->
    <div id="dashboardPage" class="hidden">
      <div class="dashboard">
        <h2>🎉 Welcome to Dashboard</h2>
        <p id="welcomeMsg">You are successfully logged in!</p>
        <p>This is a protected page. Only logged-in users can see this.</p>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

  </div>

  <script>
    // SHA-256 hashing function
    async function sha256(message){
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getUsers(){
      return JSON.parse(localStorage.getItem('users')) || [];
    }

    function saveUsers(users){
      localStorage.setItem('users', JSON.stringify(users));
    }

    function showRegister(){
      document.getElementById('registerPage').classList.remove('hidden');
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('dashboardPage').classList.add('hidden');
    }

    function showLogin(){
      document.getElementById('loginPage').classList.remove('hidden');
      document.getElementById('registerPage').classList.add('hidden');
      document.getElementById('dashboardPage').classList.add('hidden');
    }

    function showDashboard(username){
      document.getElementById('dashboardPage').classList.remove('hidden');
      document.getElementById('registerPage').classList.add('hidden');
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('welcomeMsg').innerText = `Welcome, ${username}! You are successfully logged in.`;
    }

    async function register(){
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const errorDiv = document.getElementById('regError');
      const successDiv = document.getElementById('regSuccess');
      errorDiv.innerText = '';
      successDiv.innerText = '';

      // Basic validation
      if(!username || !email || !password) return errorDiv.innerText = 'All fields are required';
      
      // Password validation: min 8 chars, 1 number
      const passwordRegex = /^(?=.*[0-9]).{8,}$/;
      if(!passwordRegex.test(password)) return errorDiv.innerText = 'Password must be at least 8 characters and contain 1 number';

      const users = getUsers();
      
      // Duplicate check
      if(users.find(u => u.username === username || u.email === email)){
        return errorDiv.innerText = 'Username or Email already exists';
      }

      const hashedPassword = await sha256(password);
      users.push({username, email, password: hashedPassword});
      saveUsers(users);
      
      successDiv.innerText = 'Registration successful! Please login.';
      setTimeout(showLogin, 1500);
    }

    async function login(){
      const userInput = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.innerText = '';

      if(!userInput || !password) return errorDiv.innerText = 'All fields are required';

      const users = getUsers();
      const hashedPassword = await sha256(password);
      const user = users.find(u => (u.username === userInput || u.email === userInput) && u.password === hashedPassword);

      if(!user) return errorDiv.innerText = 'Invalid credentials. Please try again.'; // Generic error

      localStorage.setItem('currentUser', user.username);
      showDashboard(user.username);
    }

    function logout(){
      localStorage.removeItem('currentUser');
      showLogin();
    }

    // Check if user is already logged in on page load
    window.onload = function(){
      const currentUser = localStorage.getItem('currentUser');
      if(currentUser){
        showDashboard(currentUser);
      } else {
        showLogin();
      }
    }
  </script>
</body>
</html>
