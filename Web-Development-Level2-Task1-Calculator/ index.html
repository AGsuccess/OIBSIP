<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASK 4 | Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #111;
      --accent: #00ff88;
      --text: #ffffff;
      --btn: #1a1a1a;
      --btn-hover: #222;
      --operator: #00ff88;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { 
      background: var(--bg); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh;
    }
    
    .calculator {
      background: var(--card);
      padding: 25px;
      border-radius: 20px;
      border: 1px solid #222;
      box-shadow: 0 0 40px rgba(0,255,136,0.1);
      width: 350px;
    }
    
    .display {
      background: #000;
      color: var(--text);
      font-size: 2.5rem;
      font-weight: 700;
      text-align: right;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      height: 80px;
      overflow: hidden;
      border: 2px solid #222;
    }
    
    /* CSS GRID for buttons */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    
    button {
      padding: 20px;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--btn);
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: var(--btn-hover); transform: scale(1.05); }
    
    .operator { background: var(--operator); color: #000; }
    .operator:hover { background: #00e676; }
    
    .span-2 { grid-column: span 2; }
    .equals { background: var(--accent); color: #000; }
    .equals:hover { background: #00e676; }
    
    .error { color: #ff4d4d !important; font-size: 1.2rem !important; }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="operator" data-action="clear">C</button>
      <button class="operator" data-action="delete">DEL</button>
      <button class="operator" data-operator="/">÷</button>
      <button class="operator" data-operator="*">×</button>
      
      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-operator="-">-</button>
      
      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-operator="+">+</button>
      
      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="equals span-2" data-action="calculate">=</button>
      
      <button class="span-2" data-number="0">0</button>
      <button data-number=".">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelector('.buttons');
    
    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let shouldReset = false;

    // 1. EVENT LISTENERS ON ALL BUTTONS - No inline onclick
    buttons.addEventListener('click', (e) => {
      if (!e.target.matches('button')) return;
      
      if (e.target.dataset.number) inputNumber(e.target.dataset.number);
      if (e.target.dataset.operator) setOperator(e.target.dataset.operator);
      if (e.target.dataset.action === 'clear') clear();
      if (e.target.dataset.action === 'delete') deleteLast();
      if (e.target.dataset.action === 'calculate') calculate();
      
      updateDisplay();
    });

    function inputNumber(num) {
      if (shouldReset) { currentInput = ''; shouldReset = false; }
      if (num === '.' && currentInput.includes('.')) return; // Prevent 2 decimals
      if (currentInput === '0' && num !== '.') currentInput = '';
      currentInput += num;
    }

    function setOperator(op) {
      if (operator !== null) calculate(); // Operator chaining: 5 + 3 * 2
      previousInput = currentInput;
      operator = op;
      shouldReset = true;
    }

    function calculate() {
      if (operator === null || shouldReset) return;
      let prev = parseFloat(previousInput);
      let current = parseFloat(currentInput);
      let result;

      switch(operator) {
        case '+': result = prev + current; break;
        case '-': result = prev - current; break;
        case '*': result = prev * current; break;
        case '/': 
          if (current === 0) { // Prevent division by zero
            display.classList.add('error');
            display.innerText = 'Error: Divide by 0';
            setTimeout(() => { clear(); display.classList.remove('error'); }, 1500);
            return;
          }
          result = prev / current; 
          break;
        default: return;
      }
      
      currentInput = result.toString();
      operator = null;
      previousInput = '';
      shouldReset = true;
    }

    function clear() {
      currentInput = '0';
      previousInput = '';
      operator = null;
    }
    
    function deleteLast() {
      currentInput = currentInput.toString().slice(0, -1);
      if (currentInput === '') currentInput = '0';
    }

    function updateDisplay() {
      display.innerText = currentInput;
    }
  </script>
</body>
</html>
